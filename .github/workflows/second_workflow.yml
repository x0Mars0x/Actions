name: My Second Workflow
on: push
jobs:
  create_file:
    runs-on: ubuntu-latest
    steps:
    - name: Welcome message
      run: echo "my first GitHub message" > file.txt
    - uses: actions/upload-artifact@v7
      with:
        name: my-file
        path: file.txt

  test:
    runs-on: ubuntu-latest
    needs: create_file
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: my-file
      - name: Test if file exists
        run: find . -name file.txt
        
  read_file:
    runs-on: ubuntu-latest
    needs: create_file
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: my-file    
      - name: Read file content
        run: cat file.txt
