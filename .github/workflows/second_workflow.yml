name: My Second Workflow
on: push
env:
  FILE_NAME: file.txt
jobs:
  create_file:
    runs-on: ubuntu-latest
    steps:
    - name: Welcome message
      run: echo "my first GitHub message" > ${FILE_NAME}
    - uses: actions/upload-artifact@v7
      with:
        name: my-file
        path: ${FILE_NAME}

  test:
    runs-on: ubuntu-latest
    needs: create_file
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: my-file
      - name: Test if file exists
        run: find . -name ${FILE_NAME}
        
  read_file:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: my-file    
      - name: Read file content
        run: cat ${FILE_NAME}
